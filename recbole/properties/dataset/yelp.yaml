# Yelp Open Dataset (2022) - only reviews with stars >= 4 are used as positive
# Generated by: dataset/yelp/convert_to_atomic.py  (5-core already applied)
# rating is in the file but is excluded from load_col since it is used as implicit feedback.
# (To use ratings, add rating to inter and set RATING_FIELD to stars)

# Atomic File Format
field_separator: "\t"
seq_separator: " "

# Basic Information
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
TIME_FIELD: timestamp
RATING_FIELD: rating
LABEL_FIELD: label
NEG_PREFIX: neg_

# Sequential Model Needed
ITEM_LIST_LENGTH_FIELD: item_length
LIST_SUFFIX: _list
MAX_ITEM_LIST_LENGTH: 50
POSITION_FIELD: position_id

# Selectively Loading
#   latitude/longitude are required for the RoG and circular-interval analyses.
#   .user is not created, so there is no user key.
load_col:
    inter: [user_id, item_id, timestamp]
    item: [item_id, venue_category_id, latitude, longitude]
unload_col: ~
unused_col: ~

# Filtering  (5-core already applied at the conversion stage -> no additional filtering)
rm_dup_inter: ~
val_interval: ~
filter_inter_by_user_or_item: True
user_inter_num_interval: "[0,inf)"
item_inter_num_interval: "[0,inf)"

# Preprocessing
#   Normalizing lat/lon makes RoG computation impossible, so never turn it on.
normalize_field: ~
normalize_all: ~
